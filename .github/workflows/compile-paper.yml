name: Compile Paper (Neurocomputing)

on:
  push:
    branches: [neurocomputing]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile LaTeX
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex

      - name: Zip paper source
        run: |
          zip -r minomaly-neurocomputing-source.zip \
            main.tex refs.bib newrefs.bib \
            figs/ tables/

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: neurocomputing-${{ github.sha }}
          name: Neurocomputing Build ${{ github.run_number }}
          body: Compiled Neurocomputing (Elsevier elsarticle) paper and source from commit ${{ github.sha }}
          files: |
            main.pdf
            minomaly-neurocomputing-source.zip
